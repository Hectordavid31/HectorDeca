
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5ed7">
<meta name="description" content="HectorDeca - Gestión digital de DeCA">
<title>HectorDeca</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#17202a;
}

header{
  background:#0b5ed7;
  color:white;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:5;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:5px 0 0;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.card{
  background:white;
  border-radius:14px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #0001;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 16px;
  font-size:16px;
  cursor:pointer;
}

.primary{
  background:#0b5ed7;
  color:white;
  width:100%;
  margin-bottom:9px;
}

.secondary{
  background:#e9eef5;
  color:#17202a;
  width:100%;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccd3db;
  border-radius:8px;
  font-size:16px;
  background:white;
}

textarea{
  min-height:80px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.hidden{
  display:none;
}

.item{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
  background:#fff;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.actions button{
  width:100%;
}

.small{
  font-size:13px;
  color:#667085;
}

hr{
  border:0;
  border-top:1px solid #e1e5e9;
  margin:18px 0;
}

h2{
  margin-top:4px;
}

h3{
  margin-bottom:5px;
}

.search{
  margin-bottom:10px;
}

.catalogGrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.catalogGrid button{
  width:100%;
  font-size:14px;
}

@media(max-width:560px){

  .row,
  .actions,
  .catalogGrid{
    grid-template-columns:1fr;
  }

}

@media print{

  header,
  button,
  .no-print{
    display:none!important;
  }

  body{
    background:white;
  }

  .card{
    box-shadow:none;
  }

}
</style>
</head>
