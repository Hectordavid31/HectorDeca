<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HectorDeca - DeCA</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  margin:0;
  padding:20px;
  color:#222;
}
.card{
  max-width:700px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 2px 10px #0002;
}
h1{
  background:#17202a;
  color:white;
  padding:18px;
  border-radius:10px;
  text-align:center;
  margin-top:0;
}
h2{
  color:#17202a;
  border-bottom:1px solid #ddd;
  padding-bottom:6px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.item{
  background:#f7f7f7;
  padding:10px;
  border-radius:8px;
}
.label{
  font-size:12px;
  color:#666;
}
.value{
  font-weight:bold;
  margin-top:4px;
}
.full{
  grid-column:1/-1;
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#17202a;
  color:white;
  font-size:16px;
  margin-top:18px;
}
.error{
  color:#b00020;
  text-align:center;
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
@media print{
  button{display:none;}
  body{background:white;padding:0;}
  .card{box-shadow:none;}
}
</style>
</head>

<body>

<div class="card">

<h1>HectorDeca</h1>

<div id="contenido">
  Cargando DeCA...
</div>

<button onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>

</div>

<script>

const SUPABASE_URL =
"https://uqkmwdhzuqbsiusqeroa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pXTHMC3OrsO29fXit3_z5Q_usSHAG0o";


/* =====================================================
   FECHA Y HORA EXCLUSIVAMENTE DE CANARIAS
   ===================================================== */

function fechaCanarias(iso){

  if(!iso) return "";

  return new Intl.DateTimeFormat("es-ES", {

    timeZone:"Atlantic/Canary",

    year:"numeric",
    month:"2-digit",
    day:"2-digit",

    hour:"2-digit",
    minute:"2-digit",

    hourCycle:"h23"

  })
  .format(new Date(iso))
  .replace(",", "");

}


/* =====================================================
   CARGAR DECA
   ===================================================== */

async function cargarDeCa(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("token");


  if(!token){

    document.getElementById("contenido").innerHTML =
      '<p class="error">No se ha encontrado el código de la DeCA.</p>';

    return;
  }


  try{

    const respuesta =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/get_deca_by_token",

        {
          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          },

          body:
            JSON.stringify({
              p_token:token
            })

        }

      );


    if(!respuesta.ok){

      throw new Error(
        "No se pudo consultar la DeCA"
      );

    }


    const datos =
      await respuesta.json();


    if(
      !datos ||
      datos.length === 0
    ){

      document.getElementById("contenido").innerHTML =
        '<p class="error">DeCA no encontrada o no disponible.</p>';

      return;

    }


    const d =
      datos[0];


    document.getElementById("contenido").innerHTML = `

      <h2>Datos de la DeCA</h2>

      <div class="grid">

        <div class="item">

          <div class="label">
            Código DeCA
          </div>

          <div class="value">
            ${d.deca_code || ""}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Fecha y hora (Canarias)
          </div>

          <div class="value">
            ${fechaCanarias(d.transport_date)}
          </div>

        </div>

      </div>


      <h2>Partes</h2>

      <div class="grid">

        <div class="item">

          <div class="label">
            Cargador / remitente
          </div>

          <div class="value">
            ${d.sender_name || ""}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Transportista
          </div>

          <div class="value">
            ${d.carrier_name || ""}
          </div>

        </div>


        <div class="item full">

          <div class="label">
            Destinatario
          </div>

          <div class="value">
            ${d.receiver_name || ""}
          </div>

        </div>

      </div>


      <h2>Transporte</h2>

      <div class="grid">

        <div class="item">

          <div class="label">
            Origen
          </div>

          <div class="value">
            ${d.origin || ""}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Destino
          </div>

          <div class="value">
            ${d.destination || ""}
          </div>

        </div>


        <div class="item full">

          <div class="label">
            Mercancía
          </div>

          <div class="value">
            ${d.goods || ""}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Peso
          </div>

          <div class="value">
            ${d.weight_kg || ""} kg
          </div>

        </div>


        <div class="item">

          <div class="label">
            Bultos
          </div>

          <div class="value">
            ${d.packages || ""}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Matrícula tractora
          </div>

          <div class="value">
            ${d.vehicle_plate || ""}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Matrícula remolque
          </div>

          <div class="value">
            ${d.trailer_plate || ""}
          </div>

        </div>


        <div class="item full">

          <div class="label">
            Observaciones
          </div>

          <div class="value">
            ${d.notes || ""}
          </div>

        </div>

      </div>

    `;


  }catch(error){

    console.error(error);

    document.getElementById("contenido").innerHTML =
      '<p class="error">Error al cargar la DeCA.</p>';

  }

}


cargarDeCa();

</script>

</body>
</html>
